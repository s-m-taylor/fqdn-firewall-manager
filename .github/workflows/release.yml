name: Build, Sign, and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release (for example v1.0.0). Created from the selected branch if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve tag for tag pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: echo "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        run: dotnet publish FqdnFirewallManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload executable for signing
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: publish/FqdnFirewallManager.exe
          if-no-files-found: error

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: 'FqdnFirewallManager'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-name: 'unsigned'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Verify signed download exists
        shell: pwsh
        run: |
          if (-not (Test-Path './signed/FqdnFirewallManager.exe')) {
            throw 'The signed executable was not returned by SignPath.'
          }

      - name: Create GitHub Release with signed exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./signed/FqdnFirewallManager.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
