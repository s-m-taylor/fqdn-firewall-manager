name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release (for example v1.0.0). Created from the selected branch if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve tag for tag pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: echo "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          dotnet publish FqdnFirewallManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path './publish/FqdnFirewallManager.exe')) {
            throw 'The published executable was not found.'
          }

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./publish/FqdnFirewallManager.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          "$hash  FqdnFirewallManager.exe" | Out-File -FilePath ./publish/FqdnFirewallManager.exe.sha256 -Encoding ascii -NoNewline
          echo "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          @"
          ## Verify your download

          SHA-256 of ``FqdnFirewallManager.exe``:

          ``````
          $hash
          ``````

          In PowerShell: ``(Get-FileHash .\FqdnFirewallManager.exe -Algorithm SHA256).Hash``
          "@ | Out-File -FilePath ./release-body.md -Encoding utf8

      - name: Generate WinGet manifests
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${env:RELEASE_TAG}/FqdnFirewallManager.exe"
          $out = "winget-out/manifests/s/SedricTaylor/FqdnFirewallManager/$version"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem winget/*.yaml | ForEach-Object {
            (Get-Content $_.FullName -Raw).
              Replace('{{VERSION}}', $version).
              Replace('{{INSTALLER_URL}}', $url).
              Replace('{{SHA256}}', $env:EXE_SHA256) |
              Out-File -FilePath (Join-Path $out $_.Name) -Encoding utf8
          }

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ env.RELEASE_TAG }}
          path: winget-out

      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./publish/FqdnFirewallManager.exe
            ./publish/FqdnFirewallManager.exe.sha256
          body_path: ./release-body.md
          fail_on_unmatched_files: true
          generate_release_notes: true
