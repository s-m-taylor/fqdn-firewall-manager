name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release (for example v1.0.0). Created from the selected branch if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve tag for tag pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: echo "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        run: dotnet publish FqdnFirewallManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path './publish/FqdnFirewallManager.exe')) {
            throw 'The published executable was not found.'
          }

      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./publish/FqdnFirewallManager.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
